        <option value="Маленькая">Маленькая</option>
        <option value="Большая">Большая</option>
    </select>

    <h3>Топпинги:</h3>
    <label><input type="checkbox" id="topping1"> Сливочная моцарелла</label><br>
    <label><input type="checkbox" id="topping2"> Сырный борт</label><br>
    <label><input type="checkbox" id="topping3"> Чедер и пармезан</label><br>

    <button onclick="calculate()">Рассчитать</button>

    <h3>Результат:</h3>
    <p id="price">Цена: </p>
    <p id="calories">Калории: </p>
</body>
